      progress.completed = [...progress.completed.filter((item) => item.stepId !== progress.currentStepId), { stepId: progress.currentStepId, summary: summary || "Preview 中确认完成", completedAt: new Date().toISOString() }];

    const handlePreviewMessage = (message) => {
      const workflow = workflowById(message.workflowId || sample.config.activeWorkflowId);
      if (["ready", "refresh"].includes(message.type)) return true;
      if (message.type === "initialize_workspace") previewInitialized = true;
      else if (["cleanup_workspace", "uninstall_daedalus"].includes(message.type)) previewInitialized = false;
      else if (message.type === "select_workflow" && workflowById(message.id)) sample.config.activeWorkflowId = message.id;
      else if (message.type === "add_workflow") {
        const id = previewId("workflow");
        sample.config.workflows.push({ id, name: message.name || "新研发流程", description: message.description || "Preview 自定义研发流程", agentId: message.agentId || "agent:implementation", steps: [] });

      } else if (message.type === "update_workflow") {
        const target = workflowById(message.id);
        if (target) Object.assign(target, { name: message.name || target.name, description: message.description || "", agentId: message.agentId || undefined });
      } else if (message.type === "delete_workflow") {
        sample.config.workflows = sample.config.workflows.filter((item) => item.id !== message.id);
        sample.state.progress = sample.state.progress.filter((item) => item.workflowId !== message.id);
        if (sample.config.activeWorkflowId === message.id) sample.config.activeWorkflowId = sample.config.workflows[0]?.id || "";
      } else if (message.type === "add_step" && workflow) {
        workflow.steps.push({ id: previewId("step"), name: message.name || "新步骤", description: "尚未填写步骤说明", skillIds: [], ruleIds: [], knowledgeIds: [], standards: [] });
      } else if (message.type === "save_step" && workflow) {
        const step = workflow.steps.find((item) => item.id === message.stepId);
        if (step) Object.assign(step, { name: message.name || step.name, description: message.description || "", skillIds: message.skillIds || [], ruleIds: message.ruleIds || [], knowledgeIds: message.knowledgeIds || [], standards: (message.standards || []).filter(Boolean) });
      } else if (message.type === "move_step" && workflow) {
        const index = workflow.steps.findIndex((step) => step.id === message.stepId);
        const next = index + (message.direction === "up" ? -1 : 1);
        if (index >= 0 && next >= 0 && next < workflow.steps.length) [workflow.steps[index], workflow.steps[next]] = [workflow.steps[next], workflow.steps[index]];
      } else if (message.type === "delete_step" && workflow) {
        workflow.steps = workflow.steps.filter((step) => step.id !== message.stepId);
        const progress = progressForPreview(workflow);
        progress.completed = progress.completed.filter((item) => item.stepId !== message.stepId);
        if (progress.currentStepId === message.stepId) progress.currentStepId = workflow.steps.find((step) => !progress.completed.some((item) => item.stepId === step.id))?.id || null;
      } else if (message.type === "reset_workflow" && workflow) {
        const progress = progressForPreview(workflow);
        Object.assign(progress, { currentStepId: workflow.steps[0]?.id || null, completed: [], updatedAt: new Date().toISOString() });
        sample.agentExecution = { status: "idle" };
      } else if (message.type === "revert_step" && workflow) {
        const progress = progressForPreview(workflow);
        const index = workflow.steps.findIndex((step) => step.id === message.stepId);
        progress.currentStepId = message.stepId;
        progress.completed = progress.completed.filter((item) => workflow.steps.findIndex((step) => step.id === item.stepId) < index);
      } else if (message.type === "set_current_step" && workflow) {
        const progress = progressForPreview(workflow);
        const index = workflow.steps.findIndex((step) => step.id === message.stepId);
        const previous = new Map(progress.completed.map((item) => [item.stepId, item]));
        progress.completed = workflow.steps.slice(0, index).map((step) => previous.get(step.id) || { stepId: step.id, summary: "用户选择从此阶段开始，已跳过", completedAt: new Date().toISOString() });
        progress.currentStepId = message.stepId;
        progress.updatedAt = new Date().toISOString();
        sample.agentExecution = { status: "idle" };
      } else if (message.type === "execute_step" && workflow) {
        const progress = progressForPreview(workflow);
        const index = workflow.steps.findIndex((step) => step.id === message.stepId);
        const previous = new Map(progress.completed.map((item) => [item.stepId, item]));
        progress.completed = workflow.steps.slice(0, index).map((step) => previous.get(step.id) || { stepId: step.id, summary: "用户选择执行此阶段，已跳过", completedAt: new Date().toISOString() });
        progress.currentStepId = message.stepId;
        progress.updatedAt = new Date().toISOString();
        const run = { id: previewId("run"), workflowId: workflow.id, stepId: message.stepId, channel: sample.config.settings.feedbackEnabled ? "feedback" : "cursor-native", status: "running", startedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        sample.state.runs = [...(sample.state.runs || []), run];
        sample.state.activeRunId = run.id;
        sample.agentExecution = { ...run, runId: run.id, message: sample.config.settings.feedbackEnabled ? "通过 Feedback 执行当前阶段" : "通过 Cursor 原生对话执行当前阶段" };
      } else if (message.type === "save_workflow_inputs" && workflow) progressForPreview(workflow).inputs = message.inputs || {};
      else if (message.type === "advance_workflow") advancePreview(message.summary);
      else if (message.type === "advance_from_signal") advancePreview(sample.conversationSignal?.excerpt);
      else if (message.type === "execute_current_step") {
        const current = workflow && progressForPreview(workflow).currentStepId;
        const run = { id: previewId("run"), workflowId: workflow?.id, stepId: current, channel: sample.config.settings.feedbackEnabled ? "feedback" : "cursor-native", status: "running", startedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        sample.state.runs = [...(sample.state.runs || []), run];
        sample.state.activeRunId = run.id;
        sample.agentExecution = { ...run, runId: run.id, message: sample.config.settings.feedbackEnabled ? "通过 Feedback 执行当前阶段" : "通过 Cursor 原生对话执行当前阶段" };
      } else if (message.type === "stop_current_step") sample.agentExecution = { ...sample.agentExecution, status: "stopped", finishedAt: new Date().toISOString(), message: "已由用户停止" };
      else if (message.type === "create_feedback_conversation") {
        const now = new Date().toISOString();
        const previewTitle = String(message.content || "新会话").replace(/\s+/g, " ").slice(0, 18);
        sample.state.gates.unshift({ id: previewId("conversation"), type: "feedback", title: previewTitle, message: message.content || "", createdAt: now, updatedAt: now, status: "pending", origin: "user", messages: [
          { role: "user", content: message.content || "", createdAt: now },
          { role: "agent", content: "这是 Preview 中模拟的 Agent 回复。这个会话不依赖 Workspace 初始化，也不会推进研发流程。", createdAt: new Date().toISOString() }
        ] });
      } else if (message.type === "send_feedback_message") {
        const conversation = sample.state.gates.find((item) => item.id === message.id && item.origin === "user");
        if (conversation) {
          const now = new Date().toISOString();
          conversation.message = message.content || conversation.message;
          conversation.updatedAt = now;
          conversation.messages = [...(conversation.messages || []),
            { role: "user", content: message.content || "", createdAt: now },
            { role: "agent", content: "收到。Preview 已保留这段多轮会话上下文，你可以继续补充或调整方向。", createdAt: new Date().toISOString() }
          ];
        }
      }
      else if (message.type === "resolve_gate") {
        const gate = sample.state.gates.find((item) => item.id === message.id);
        if (gate) Object.assign(gate, { status: "resolved", decision: message.decision, response: message.response || "", resolvedAt: new Date().toISOString() });
      } else if (message.type === "save_knowledge") {
        const existing = sample.knowledge.find((item) => item.id === message.id);
        if (existing) Object.assign(existing, { name: message.name, description: message.description || "", content: `# ${message.name}\n\n${message.content || ""}` });
        else sample.knowledge.push({ id: `${message.scope || "project"}:knowledge:${previewId("entry")}`, name: message.name, description: message.description || "", scope: message.scope || "project", source: "direct", relativePath: `${message.name}.md`, content: `# ${message.name}\n\n${message.content || ""}` });
      } else if (message.type === "create_library_item") {
        sample.library.push({ id: `${message.kind}:${previewId("custom")}`, kind: message.kind, name: message.name, description: message.description || "", scope: message.scope || "project", source: "workspace", relativePath: `.daedalus/${message.kind}s/preview.md`, content: message.content || "" });
      } else if (message.type === "import_git") {
        const id = previewId("git-import");
        const entry = { id, name: "preview-import", url: message.url || "https://example.com/team/standards.git", ref: message.ref || "main", subpath: message.subpath || "", target: message.target || "standards", scope: message.scope || "project", importedAt: new Date().toISOString(), relativePath: `${message.target === "knowledge" ? "knowledge-imports" : "imports"}/preview-import` };
        if (entry.scope === "global") sample.globalImports.push(entry); else sample.config.imports.push(entry);
        if (entry.target === "knowledge") sample.knowledge.push({ id: `${entry.scope}:git:${id}:README.md`, name: "导入知识示例", description: "来自 Preview Git 导入。", scope: entry.scope, source: "git", importId: id, relativePath: `${entry.relativePath}/README.md`, content: "# 导入知识示例" });
        else sample.library.push({ id: `git:${id}:skill:preview`, kind: "skill", name: "Imported Preview Skill", description: "来自 Preview Git 导入。", scope: entry.scope, source: "git", importId: id, relativePath: `${entry.relativePath}/skills/preview/SKILL.md` });
      } else if (message.type === "import_local_markdown") {
        const id = previewId("local-import");
        const entry = { id, name: "preview-local.md", target: message.target || "standards", kind: message.kind, scope: message.scope || "project", importedAt: new Date().toISOString(), relativePath: `${message.target === "knowledge" ? "knowledge" : `${message.kind}s`}/preview-local.md` };
        if (entry.scope === "global") sample.globalLocalImports.push(entry); else sample.config.localImports.push(entry);
        if (entry.target === "knowledge") sample.knowledge.push({ id: `${entry.scope}:knowledge:preview-local`, name: "本地知识示例", description: "Preview 本地 Markdown 导入。", scope: entry.scope, source: "local", importId: id, relativePath: entry.relativePath, content: "# 本地知识示例" });
        else sample.library.push({ id: `${entry.kind || "skill"}:preview-local`, kind: entry.kind || "skill", name: "Local Preview Resource", description: "Preview 本地 Markdown 导入。", scope: entry.scope, source: "local", importId: id, relativePath: entry.relativePath });
      } else if (message.type === "update_import") {
        const imports = message.scope === "global" ? sample.globalImports : sample.config.imports;
        const entry = imports.find((item) => item.id === message.id);
        if (entry) entry.importedAt = new Date().toISOString();
      } else if (message.type === "delete_import") {
        if (message.scope === "global") sample.globalImports = sample.globalImports.filter((item) => item.id !== message.id);
        else sample.config.imports = sample.config.imports.filter((item) => item.id !== message.id);
        sample.library = sample.library.filter((item) => item.importId !== message.id);
        sample.knowledge = sample.knowledge.filter((item) => item.importId !== message.id);
      } else if (message.type === "link_knowledge_directory") {
        const id = previewId("linked-preview");
        const scope = message.scope === "global" ? "global" : "project";
        sample.config.linkedKnowledgeDirs.push({ id, name: "新关联知识目录", path: `/demo/linked/${id}`, scope, linkedAt: new Date().toISOString() });
        sample.knowledge.push({ id: `linked:${id}:engineering/api.md`, name: "团队 API 约定", description: "来自新关联目录的 Markdown 知识。", scope, source: "linked", linkedDirId: id, absolutePath: `/demo/linked/${id}/engineering/api.md`, relativePath: "engineering/api.md", content: "# 团队 API 约定\n\nPreview 中模拟的关联知识。" });
      } else if (message.type === "unlink_knowledge_directory") {
        sample.config.linkedKnowledgeDirs = sample.config.linkedKnowledgeDirs.filter((item) => item.id !== message.id);
        sample.knowledge = sample.knowledge.filter((item) => item.linkedDirId !== message.id);
      } else if (message.type === "update_language") {
        sample.config.settings.language = message.language;
        sample.preferences.languageSetting = message.language;
        sample.preferences.language = message.language === "auto" ? "zh-CN" : message.language;
      } else if (message.type === "update_theme") sample.preferences.themeSetting = message.theme;
      else if (message.type === "update_feedback") sample.config.settings.feedbackEnabled = message.enabled;
      else if (message.type === "update_continuous_feedback") sample.config.settings.continuousFeedback = message.enabled;
      else if (message.type === "update_auto_execute") sample.config.settings.autoExecuteOnAdvance = message.enabled;
      else if (message.type === "update_artifact_output") sample.config.settings.artifactOutput = { mode: message.mode, directory: message.directory, repositoryUrl: message.repositoryUrl, ref: message.ref };
      else if (message.type === "acknowledge_conversation_signal" && sample.conversationSignal) sample.conversationSignal.acknowledgedAt = new Date().toISOString();
      else if (message.type === "git_commit") {
        const repo = sample.git.find((item) => item.root === message.repoRoot);
        if (repo) repo.files = repo.files.filter((file) => !(message.paths || []).includes(file.path));
      } else if (["open_config", "open_file", "open_item", "open_import_source", "open_artifact_preview", "git_open_diff", "git_refresh", "pick_workflow_input_file"].includes(message.type)) console.info("Preview action", message);
      else return false;
      return true;
    };
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        if (handlePreviewMessage(message)) setTimeout(() => previewInitialized ? emitPreviewState() : emitPreviewUninitialized(), 0);
      },
      getState() { return previewUiState; },
      setState(value) { previewUiState = value || {}; }
    });
  </script>
  <script src="../media/webview.js"></script>
  <script>if (!previewInitialized) setTimeout(emitPreviewUninitialized, 0);</script>
</body>
</html>
